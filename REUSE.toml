# Files without their own SPDX header. Specs must start with their title line
# (`cargo xtask check-specs`), skills and agents start with front matter, JSON has
# no comments, and lock files, mockups, schemas and public API snapshots are
# generated. Test fixtures are compared byte for byte.
version = 1

[[annotations]]
path = [
    "AGENTS.md",
    "CLAUDE.md",
    "Cargo.lock",
    "fuzz/Cargo.lock",
    "flake.lock",
    "TODO.md",
    ".release-please-manifest.json",
    "release-please-config.json",
    ".claude/settings.json",
    ".claude/commands/**",
    ".claude/skills/**",
    ".claude/agents/**",
    "docs/**",
    "specs/**",
    "mockups/**",
    "schemas/**",
    "crates/**/public-api.txt",
    "crates/**/tests/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Framehive contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The owner's digiKam sidecars, cleaned of people, GPS and serial numbers.
[[annotations]]
path = "crates/adapters/xmp/tests/fixtures/digikam/*"
precedence = "override"
SPDX-FileCopyrightText = "2018 Andy Pollari"
SPDX-License-Identifier = "LicenseRef-Framehive-Test-Data"

# The owner's darktable sidecars, copies of the files in framehive-testdata.
[[annotations]]
path = "crates/adapters/xmp/tests/fixtures/darktable/eos-350d-cosmos.*"
precedence = "override"
SPDX-FileCopyrightText = "2016 Andy Pollari"
SPDX-License-Identifier = "LicenseRef-Framehive-Test-Data"

[[annotations]]
path = "crates/adapters/xmp/tests/fixtures/darktable/eos-7d-garden-house.*"
precedence = "override"
