[workspace]
resolver = "3"
members = [
    "apps/cli",
    "crates/adapters/blake3",
    "crates/adapters/clock",
    "crates/adapters/fs",
    "crates/adapters/mounts",
    "crates/domain",
    "crates/kernel",
    "crates/services/devices",
    "crates/services/files",
    "crates/services/metadata",
    "crates/services/naming",
    "modules/import/import",
    "modules/import/import-ui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
publish = false

# Every direct dependency is pinned here and listed in dependencies.yaml (ADR 0009).
[workspace.dependencies]
adapter-blake3 = { path = "crates/adapters/blake3" }
adapter-clock = { path = "crates/adapters/clock" }
adapter-fs = { path = "crates/adapters/fs" }
adapter-mounts = { path = "crates/adapters/mounts" }
devices = { path = "crates/services/devices" }
domain = { path = "crates/domain" }
files = { path = "crates/services/files" }
import = { path = "modules/import/import" }
import-ui = { path = "modules/import/import-ui" }
kernel = { path = "crates/kernel" }
metadata = { path = "crates/services/metadata" }
naming = { path = "crates/services/naming" }
blake3 = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
thiserror = { version = "2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
too_many_lines = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
