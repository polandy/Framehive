# Allowlist of direct dependencies (ADR 0009).
# `cargo xtask check-dependencies` rejects any direct dependency that is missing here,
# used by a layer that is not allowed, or built with features that are not listed.
schema_version: 1

dependencies:
  - name: thiserror
    purpose: Error types in library crates
    rationale: De-facto standard for error types, no runtime cost; required by CLAUDE.md for all libraries
    review: Rust ecosystem staple maintained by dtolnay, version 2, std-only, no transitive dependencies besides its proc macro
    adr: "0016"
    allowed_layers: [domain, kernel, service, module, adapter]
    features: [std]

  - name: blake3
    purpose: BLAKE3 checksums of imported files, in adapter-blake3
    rationale: A cryptographic hash function is a deep, security-critical problem ADR 0009 assigns to a library; BLAKE3 is the checksum architecture §8 names
    review: Official implementation by the BLAKE3 authors (BLAKE3-team), version 1.x, CC0-1.0 OR Apache-2.0; its SIMD paths contain assembly and C built by its build script, accepted in ADR 0020 §5
    adr: "0020"
    allowed_layers: [adapter]
    allowed_crates: [adapter-blake3]
    features: [std]

  - name: jiff
    purpose: The system time and the local UTC offset of the system time zone, in adapter-clock
    rationale: Time zone rules and the system time zone database are a deep problem ADR 0009 assigns to a library; std has no time zones
    review: By Andrew Gallant (BurntSushi), pure Rust, Unlicense OR MIT; version 0.2 before 1.0 is an accepted exception, confined to one adapter (ADR 0022)
    adr: "0022"
    allowed_layers: [adapter]
    allowed_crates: [adapter-clock]
    features: [std, tz-system, tzdb-zoneinfo]

  - name: clap
    purpose: The command line of framehive-cli, with the builder API
    rationale: Help text, error messages and subcommands of a command line are a broad problem readers expect clap to solve; the builder API avoids a proc-macro crate for a handful of arguments
    review: The most used argument parser in Rust (Cargo, rustup), by the clap-rs organization with several active maintainers, version 4.x, MIT OR Apache-2.0
    adr: "0020"
    allowed_layers: [app]
    allowed_crates: [framehive-cli]
    features: [std, help, usage, error-context]
