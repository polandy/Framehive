# cargo-deny configuration (ADR 0009, ADR 0014).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The allowlist covers expected future dependencies, so unused entries are fine.
unused-allowed-license = "allow"
# Only licenses compatible with GPL-3.0-or-later (ADR 0014).
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are GPL-3.0-or-later and never published.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
