# The fuzz targets of Framehive (ADR 0037). A workspace of its own with its own lock
# file, so the main workspace, `cargo xtask ci` and the release build never see
# libFuzzer. Built only in `nix develop .#fuzz`, by `cargo xtask fuzz`.

[package]
name = "metadata-fuzz"
description = "Coverage-guided fuzz targets for the EXIF, XMP, YAML configuration and name template parsers"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Marks the crate for cargo-fuzz.
[package.metadata]
cargo-fuzz = true

[package.metadata.framehive]
layer = "tooling"

[dependencies]
adapter-xmp.workspace = true
adapter-yaml.workspace = true
config.workspace = true
domain.workspace = true
libfuzzer-sys.workspace = true
metadata.workspace = true
naming.workspace = true

[[bin]]
name = "capture_time"
path = "fuzz_targets/capture_time.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmp"
path = "fuzz_targets/xmp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name_template"
path = "fuzz_targets/name_template.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# Pinned once, as in the main workspace (ADR 0009).
[workspace.dependencies]
adapter-xmp = { path = "../crates/adapters/xmp" }
adapter-yaml = { path = "../crates/adapters/yaml" }
config = { path = "../crates/services/config" }
domain = { path = "../crates/domain" }
libfuzzer-sys = { version = "0.4", default-features = false, features = ["link_libfuzzer"] }
metadata = { path = "../crates/services/metadata" }
naming = { path = "../crates/services/naming" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true
