# Keeps a release pull request open from the Conventional Commits on main and tags the
# release when it is merged (ADR 0045).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the release token
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::The RELEASE_PLEASE_TOKEN secret is missing (docs/dev/pull-requests.md §8)."
            exit 1
          fi
      # Actions are pinned to a commit, because a tag can be moved (ADR 0018).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT lets CI run on the release PR; GITHUB_TOKEN would not start it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
