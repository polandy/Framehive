# Builds each release with `nix build` on Linux and macOS and runs the command once, so
# the documented install works for the tag. Nothing is uploaded (ADR 0045 §5).
name: Release build

on:
  release:
    types: [published]
  # A pull request that changes the packaging proves the release build before the tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - flake.nix
      - flake.lock
      - nix/**
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Actions are pinned to a commit, because a tag can be moved (ADR 0018).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Same key as ci.yml, so the store of main (LibRaw, libgphoto2) is restored.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          # A tag's cache is never restored anywhere else (ADR 0018 §5).
          save: false

      - name: nix build
        run: nix build --print-build-logs

      - name: Smoke test
        # Passed as a variable, never interpolated into the script.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./result/bin/framehive --help
          version="$(./result/bin/framehive --version)"
          echo "$version"
          if [ -n "$TAG" ] && [ "$version" != "framehive ${TAG#v}" ]; then
            echo "::error::The build says '$version', but the release is $TAG."
            exit 1
          fi
