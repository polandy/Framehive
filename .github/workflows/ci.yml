# CI runs exactly `cargo xtask ci` in the Nix shell, on Linux and macOS (ADR 0007,
# ADR 0018). Add checks to xtask, never here, so a local run stays identical.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run worthless; main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Actions are pinned to a commit, because a tag can be moved (ADR 0018).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The spec trailer check compares with the base branch (ADR 0010 §4).
          fetch-depth: 0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # Keep the build inputs of the shell, so garbage collection below spares them.
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      # LibRaw and libgphoto2 are overridden in flake.nix, so cache.nixos.org never has
      # them. The store is restored per OS and architecture and saved when the key is new.
      # An older cache is a good start: Nix builds only what changed (ADR 0018).
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          # Bounds the saved store. The shell is a GC root (next step), so only older
          # paths go. GitHub also evicts the least recently used cache above 10 GB.
          gc-max-store-size: 4G

      # Builds the shell once and roots it, so the cache holds it. Timed on its own.
      - name: Build the Nix shell
        run: nix develop --profile /nix/var/nix/profiles/ci-shell --command true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # `cargo xtask ci` fetches the test data and skips what the cache already holds
      # (ADR 0017). The key changes with every change of the lock; an older cache is
      # still a good start, because fetching replaces only the entries that changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testdata
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata.lock') }}
          restore-keys: testdata-${{ runner.os }}-

      - name: cargo xtask ci
        # The spec trailer check judges the title and description as the future squash
        # commit (ADR 0010 §4). Passed as variables, never interpolated into the script,
        # so the text cannot inject commands. Empty on `main`, where they are not used.
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: nix develop --command cargo xtask ci

      # `cargo xtask ci` writes the report, so a local run produces the same file (ADR 0010).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        with:
          name: spec-report
          path: target/spec-report.md
          if-no-files-found: warn
