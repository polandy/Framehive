# Nightly coverage-guided fuzzing of our own parsers (ADR 0037 §4). Not a required
# check: its result depends on time and machine, so it never blocks a pull request.
# The workflow only calls `cargo xtask fuzz` in the fuzz shell, like ci.yml calls
# `cargo xtask ci`.
name: Fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: xtask fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to a commit, because a tag can be moved (ADR 0018).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: fuzz-cargo-${{ hashFiles('flake.lock', 'Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-cargo-

      # The grown corpus is kept between runs, so the fuzzer does not start from
      # scratch (ADR 0037 §5). A cache cannot be overwritten, so every run saves a new
      # one and the next run restores the newest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: cargo xtask fuzz
        run: nix develop .#fuzz --command cargo xtask fuzz 2>&1 | tee fuzz.log

      # The crashing input and the log, to turn the finding into a regression test.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: fuzz-finding
          path: |
            fuzz/artifacts
            fuzz.log
          if-no-files-found: warn
