# Keeps the commit-pinned GitHub Actions current. Cargo dependencies are updated by
# hand, because each one is a reviewed decision (ADR 0009).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
