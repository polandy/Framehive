[package]
name = "adapter-macos-trash"
description = "The macOS Trash of Framehive for the Trash port of files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.framehive]
layer = "adapter"
port = "files"
ffi = true

[dependencies]
files.workspace = true

# The workspace lints forbid `unsafe`, and a forbid cannot be lifted, so this FFI crate
# repeats them without that rule and makes clippy demand a `// SAFETY:` comment on
# every unsafe block (architecture §3).
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
